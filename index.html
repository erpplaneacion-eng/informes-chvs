<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Informes de Gestión Humana CHVS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Poppins:wght@400;500&display=swap">
<style>
:root{--ink:#111;--muted:#5E6660;--accent:#00923F;--accent-2:#76B82A;--barra:#268C39;--surface:#F7F7F7;color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 "Poppins","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:48px 16px;box-sizing:border-box}
h1{font:800 clamp(30px,5vw,44px)/1.1 "League Spartan",Arial,sans-serif;margin:0 0 8px;background:linear-gradient(90deg,var(--accent-2),var(--accent) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:0 0 28px}
a.inf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:18px 20px;color:var(--ink);text-decoration:none}
a.inf:hover,a.inf:focus-visible{outline:2px solid var(--accent)}
a.inf b{font:700 20px "League Spartan",Arial,sans-serif}
a.inf span{color:var(--accent);font-weight:500}
.barra{display:grid;grid-template-columns:3fr 7fr;height:14px}.barra i:first-child{background:var(--accent-2)}.barra i:last-child{background:var(--barra)}
</style>
</head>
<body>
<main>
  <h1>Informes de Gestión Humana</h1>
  <p>Separador de expedientes · Corporación Hacia un Valle Solidario</p>
  <a class="inf" href="2026-10/"><b>Octubre 2026</b><span>26 ago – 12 oct · Ver informe →</span></a>
</main>
<div class="barra" aria-hidden="true"><i></i><i></i></div>
</body>
</html>
